<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Character Viewport with Sliders and Outline</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: row;
      gap: 20px;
      padding: 20px;
    }

    #viewport {
      position: relative;
      width: 512px;
      height: 512px;
      border: 2px solid #555;
      background-color: #222;
    }

    canvas {
      width: 512px;
      height: 512px;
      image-rendering: pixelated;
      background-color: transparent;
      display: block;
    }

    .controls {
      max-height: 100vh;
      overflow-y: auto;
      padding: 10px;
      background: #222;
      border: 1px solid #444;
    }

    .control-group {
      margin-bottom: 1em;
      border-bottom: 1px solid #333;
      padding-bottom: 1em;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 0.5em;
    }

    input[type="range"] {
      width: 100%;
    }

    .info {
      font-size: 0.9em;
      color: #aaa;
    }
	
		  img#arm {
    filter: drop-shadow(0 0 1px white) drop-shadow(0 0 1px white);
  }
  
    img#arm {
    z-index: 10;
    position: absolute; /* Required for z-index to take effect */
  }
	
  </style>
</head>
<body>

  <div id="viewport">
    <canvas id="characterCanvas" width="512" height="512"></canvas>
  </div>

  <div class="controls" id="controls"></div>

  <script>
    const parts = ["body", "belly", "arm", "butt", "thighs", "breast", "hair"];

    const bellyVariants = ["Belly", "Belly1", "Belly2", "Belly3", "Belly4"];
    const hairVariants = ["HairTied", "HairLoose"];

    const defaultPositions = {
      body: { x: 0, y: 0 },
      belly: { x: 173, y: 84 },
      arm: { x: 163, y: 76 },
      butt: { x: 44, y: 110 },
      thighs: { x: 115, y: 159 },
      breast: { x: 184, y: 90 },
      hair: { x: 143, y: 39 }
    };

    const stageLimits = {
      body: 1,
      belly: 251,
      arm: 240,
      butt: 351,
      thighs: 228,
      breast: 301,
      hair: 600
    };

    const state = {};

    // Store loaded Image objects here
    const imagesCache = {};

    // Get canvas and context
    const canvas = document.getElementById('characterCanvas');
    const ctx = canvas.getContext('2d');

    // Load a single image asynchronously with caching
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        if (imagesCache[src]) {
          resolve(imagesCache[src]);
          return;
        }
        const img = new Image();
        img.onload = () => {
          imagesCache[src] = img;
          resolve(img);
        };
        img.onerror = reject;
        img.src = src;
      });
    }

async function drawCharacterWithOutline() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const offscreen = document.createElement('canvas');
  offscreen.width = canvas.width;
  offscreen.height = canvas.height;
  const offCtx = offscreen.getContext('2d');

  // Draw all parts to offscreen context (no outline yet)
  for (const part of parts) {
    const variantFolder = (part === 'belly' || part === 'hair') ? state[part].variant : part;
    const stage = state[part].stage;
    const x = state[part].x;
    const y = state[part].y;

    const src = `https://raw.githubusercontent.com/piritaargenta/life/refs/heads/main/viewport/${variantFolder}/${stage}.png`;

    try {
      const img = await loadImage(src);
      offCtx.drawImage(img, x, y);
    } catch (e) {
      console.warn(`Failed to load image: ${src}`);
    }
  }

  // Apply full-character white outline from offscreen to main canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.shadowColor = 'white';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
  ctx.drawImage(offscreen, 0, 0);

  // Disable shadow and redraw the combined character
  ctx.shadowColor = 'transparent';
  ctx.drawImage(offscreen, 0, 0);

  // ✴️ Draw arm outline (solid color line)
  const armVariant = state["arm"].variant || "arm";
  const armStage = state["arm"].stage;
  const armX = state["arm"].x;
  const armY = state["arm"].y;
  const armSrc = `https://raw.githubusercontent.com/piritaargenta/life/refs/heads/main/viewport/${armVariant}/${armStage}.png`;

  try {
    const armImg = await loadImage(armSrc);

    // Create a temporary canvas to get arm alpha shape
    const temp = document.createElement('canvas');
    temp.width = armImg.width;
    temp.height = armImg.height;
    const tempCtx = temp.getContext('2d');
    tempCtx.drawImage(armImg, 0, 0);

    const imgData = tempCtx.getImageData(0, 0, armImg.width, armImg.height);
    const data = imgData.data;

    // Create a path around non-transparent pixels
    const path = new Path2D();
    for (let y = 0; y < armImg.height; y++) {
      for (let x = 0; x < armImg.width; x++) {
        const i = (y * armImg.width + x) * 4 + 3;
        if (data[i] > 20) { // alpha threshold
          path.rect(armX + x, armY + y, 1, 1);
        }
      }
    }

    ctx.save();
    ctx.strokeStyle = 'white'; // Choose your arm outline color here
    ctx.lineWidth = 1;
    ctx.stroke(path);
    ctx.restore();
  } catch (e) {
    console.warn(`Failed to outline arm: ${armSrc}`);
  }
}


    function setPartStage(part, stage) {
      state[part].stage = stage;
      updateInfo(part);
      drawCharacterWithOutline();
    }

    function setPartPosition(part, x, y) {
      state[part].x = x;
      state[part].y = y;
      updateInfo(part);
      drawCharacterWithOutline();
    }

    function setPartVariant(part, variant) {
      state[part].variant = variant;
      updateInfo(part);
      drawCharacterWithOutline();
    }

    function updateInfo(part) {
      const info = document.getElementById(`info-${part}`);
      const { stage, x, y, variant } = state[part];
      const variantInfo = variant ? ` | Variant: ${variant}` : '';
      if (info) info.textContent = `Image: ${stage} | X: ${x} | Y: ${y}${variantInfo}`;
    }

    function createLabeledControl(labelText, input, minusBtn, plusBtn) {
      const label = document.createElement("label");
      label.textContent = labelText;

      const container = document.createElement("div");
      container.style.display = "flex";
      container.style.alignItems = "center";
      container.style.gap = "5px";

      container.appendChild(minusBtn);
      container.appendChild(input);
      container.appendChild(plusBtn);

      label.appendChild(container);
      return label;
    }

    function createControlGroup(part) {
      state[part] = {
        stage: 1,
        x: defaultPositions[part]?.x || 0,
        y: defaultPositions[part]?.y || 0,
        variant: part === "belly" ? bellyVariants[0] : part === "hair" ? hairVariants[0] : null
      };



      const wrapper = document.createElement("div");
      wrapper.className = "control-group";

      const title = document.createElement("h3");
      title.textContent = part.toUpperCase();
      wrapper.appendChild(title);

      // Variant selector
      if (part === "belly" || part === "hair") {
        const variantLabel = document.createElement("label");
        variantLabel.textContent = part === "belly" ? "Belly Type" : "Hair Style";

        const select = document.createElement("select");
        const variantList = part === "belly" ? bellyVariants : hairVariants;

        variantList.forEach(v => {
          const opt = document.createElement("option");
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        });

        select.value = state[part].variant;
        select.addEventListener("change", () => {
          setPartVariant(part, select.value);
        });

        variantLabel.appendChild(select);
        wrapper.appendChild(variantLabel);
      }

      // Stage slider and buttons
      const maxStage = stageLimits[part] || 10;
      const inputStage = document.createElement("input");
      inputStage.type = "range";
      inputStage.min = 1;
      inputStage.max = maxStage;
      inputStage.step = (part === "thighs") ? 4 : 1;
      inputStage.value = 1;
      inputStage.style.flex = "1";

      const btnStageMinus = document.createElement("button");
      btnStageMinus.textContent = "–";
      btnStageMinus.onclick = () => {
        const step = (part === "thighs") ? 4 : 1;
        if (parseInt(inputStage.value) > 1) {
          inputStage.value = Math.max(1, parseInt(inputStage.value) - step);
          setPartStage(part, parseInt(inputStage.value));
        }
      };

      const btnStagePlus = document.createElement("button");
      btnStagePlus.textContent = "+";
      btnStagePlus.onclick = () => {
        const step = (part === "thighs") ? 4 : 1;
        if (parseInt(inputStage.value) < maxStage) {
          inputStage.value = Math.min(maxStage, parseInt(inputStage.value) + step);
          setPartStage(part, parseInt(inputStage.value));
        }
      };

      inputStage.addEventListener("input", () => {
        setPartStage(part, parseInt(inputStage.value));
      });

      wrapper.appendChild(createLabeledControl("Image Stage", inputStage, btnStageMinus, btnStagePlus));

      // X slider and buttons
      const inputX = document.createElement("input");
      inputX.type = "range";
      inputX.min = -200;
      inputX.max = 200;
      inputX.value = state[part].x;
      inputX.style.flex = "1";

      const btnXMinus = document.createElement("button");
      btnXMinus.textContent = "–";
      btnXMinus.onclick = () => {
        if (parseInt(inputX.value) > -200) {
          inputX.value = parseInt(inputX.value) - 1;
          setPartPosition(part, parseInt(inputX.value), state[part].y);
        }
      };

      const btnXPlus = document.createElement("button");
      btnXPlus.textContent = "+";
      btnXPlus.onclick = () => {
        if (parseInt(inputX.value) < 200) {
          inputX.value = parseInt(inputX.value) + 1;
          setPartPosition(part, parseInt(inputX.value), state[part].y);
        }
      };

      inputX.addEventListener("input", () => {
        setPartPosition(part, parseInt(inputX.value), state[part].y);
      });

      wrapper.appendChild(createLabeledControl("X Position", inputX, btnXMinus, btnXPlus));

      // Y slider and buttons
      const inputY = document.createElement("input");
      inputY.type = "range";
      inputY.min = -200;
      inputY.max = 200;
      inputY.value = state[part].y;
      inputY.style.flex = "1";

      const btnYMinus = document.createElement("button");
      btnYMinus.textContent = "–";
      btnYMinus.onclick = () => {
        if (parseInt(inputY.value) > -200) {
          inputY.value = parseInt(inputY.value) - 1;
          setPartPosition(part, state[part].x, parseInt(inputY.value));
        }
      };

      const btnYPlus = document.createElement("button");
      btnYPlus.textContent = "+";
      btnYPlus.onclick = () => {
        if (parseInt(inputY.value) < 200) {
          inputY.value = parseInt(inputY.value) + 1;
          setPartPosition(part, state[part].x, parseInt(inputY.value));
        }
      };

      inputY.addEventListener("input", () => {
        setPartPosition(part, state[part].x, parseInt(inputY.value));
      });

      wrapper.appendChild(createLabeledControl("Y Position", inputY, btnYMinus, btnYPlus));

      // Info line
      const info = document.createElement("div");
      info.id = `info-${part}`;
      info.className = "info";
      wrapper.appendChild(info);

      updateInfo(part);

      return wrapper;
    }

    // Initialize controls
    const controlsDiv = document.getElementById("controls");
    for (const part of parts) {
      controlsDiv.appendChild(createControlGroup(part));
    }

    // Initial draw
    drawCharacterWithOutline();
	
	
	
  </script>
  
  <style>
  #top-bar {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 9999;
  }

  #top-bar button {
    padding: 4px 8px;
    margin-left: 5px;
    font-size: 12px;
  }

  #controls {
    display: none;
  }

  #bottom-panel {
    position: absolute;
    top: 540px;
    left: 20px;
    background: #222;
    border: 1px solid #444;
    padding: 10px;
    color: white;
    font-family: sans-serif;
    font-size: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #bottom-panel button {
    padding: 4px 8px;
  }
</style>

<div id="top-bar">
  <button onclick="toggleControls()">Debug</button>
</div>

<div id="bottom-panel">
  <div>Weight: <span id="weight-display">40.00</span> kg</div>
  <button onclick="adjustWeight(1)">Gain Weight</button>
  <button onclick="adjustWeight(-1)">Lose Weight</button>
  <button onclick="applyPreset(1)">I'm skinny</button>
  <button onclick="applyPreset(2)">I'm pudgy</button>
  <button onclick="applyPreset(3)">I'm chubby</button>
</div>

<script>
  let weight = 0;

  const adjustableParts = parts.filter(p => p !== "body"); // allow hair
  const weightDisplay = document.getElementById("weight-display");

  const presets = {
    1: { belly: 10, arm: 20, butt: 60, thighs: 21, breast: 60, hair: 160 },
    2: { belly: 40, arm: 30, butt: 100, thighs: 41, breast: 80, hair: 160 },
    3: { belly: 68, arm: 50, butt: 120, thighs: 81, breast: 120, hair: 160 }
  };

  function toggleControls() {
    const ctrl = document.getElementById("controls");
    ctrl.style.display = ctrl.style.display === "none" ? "block" : "none";
  }

  function adjustWeight(delta) {
    adjustableParts.forEach(part => {
      const step = (part === "thighs") ? 4 : 1;
      const newStage = state[part].stage + delta * step;
      const max = stageLimits[part];
      state[part].stage = Math.max(1, Math.min(max, newStage));
    });
    recalculateWeight(); // calculate based on stage
    drawCharacterWithOutline();
  }

  function recalculateWeight() {
    let total = 0;
    adjustableParts.forEach(part => {
      total += state[part].stage;
    });
    weight = total * 0.15;
    weightDisplay.textContent = weight.toFixed(2);
  }

  function applyPreset(presetNumber) {
    const preset = presets[presetNumber];
    for (const part in preset) {
      if (state[part]) {
        state[part].stage = preset[part];
      }
    }
    recalculateWeight(); // apply weight based on preset stages
    drawCharacterWithOutline();
  }
</script>


</body>
</html>
